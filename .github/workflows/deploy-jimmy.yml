name: Deploy Jimmy Site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: jimmy-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Validate site
        run: python3 scripts/check_site.py dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Deploys over SSM: the runner never connects to the host, so port 22 does
    # not have to be open to GitHub's runners. id-token lets it assume the
    # deploy role with OIDC; there are no long-lived AWS keys.
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DEPLOY_ARTIFACTS_BUCKET: ${{ vars.DEPLOY_ARTIFACTS_BUCKET }}
      EC2_APP_ROOT: ${{ vars.EC2_APP_ROOT || '/home/ubuntu/projects/jimmy' }}
      EC2_APP_PORT: ${{ vars.EC2_APP_PORT || '18503' }}
      EC2_HEALTH_PATH: ${{ vars.EC2_HEALTH_PATH || '/healthz/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Validate site
        run: python3 scripts/check_site.py dist

      - name: Create release archive
        run: tar -czf /tmp/jimmy-site.tgz dist Dockerfile deploy/nginx/container.default.conf

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload deploy bundle
        id: bundle
        run: |
          test -n "$INSTANCE_ID" || { echo "EC2_INSTANCE_ID secret is not set" >&2; exit 1; }
          test -n "$DEPLOY_ARTIFACTS_BUCKET" || { echo "DEPLOY_ARTIFACTS_BUCKET variable is not set" >&2; exit 1; }
          # What scp used to copy: the site archive and the host-side script.
          tar -czf /tmp/bundle.tgz -C /tmp jimmy-site.tgz -C "$GITHUB_WORKSPACE/deploy/server" deploy-jimmy.sh
          uri="s3://${DEPLOY_ARTIFACTS_BUCKET}/jimmy/${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}.tgz"
          aws s3 cp /tmp/bundle.tgz "$uri" --only-show-errors
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSM and check health
        env:
          BUNDLE_URI: ${{ steps.bundle.outputs.uri }}
        run: |
          scripts/ssm-run.sh "deploy jimmy ${GITHUB_SHA::7}" deploy/ssm/remote-deploy.sh 900 \
            BUNDLE_URI="$BUNDLE_URI" \
            AWS_REGION="$AWS_REGION" \
            APP_ROOT="$EC2_APP_ROOT" \
            APP_PORT="$EC2_APP_PORT" \
            HEALTH_PATH="$EC2_HEALTH_PATH"
